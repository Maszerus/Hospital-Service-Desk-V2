<div class="page-heading">
  <div>
    <p class="eyebrow" id="ticket-number">Zgłoszenie</p>
    <h1 id="ticket-title">Szczegóły zgłoszenia</h1>
  </div>
</div>
<div class="details-grid">
  <section class="panel" aria-labelledby="description-title">
    <h2 id="description-title">Opis problemu</h2>
    <p id="ticket-description" class="ticket-description"></p>
  </section>
  <section class="panel" aria-labelledby="metadata-title">
    <h2 id="metadata-title">Informacje o zgłoszeniu</h2>
    <dl>
      <dt>Status</dt>
      <dd><span id="ticket-status"></span></dd>
      <dt>Priorytet</dt>
      <dd id="ticket-priority"></dd>
      <dt>Zgłaszający</dt>
      <dd id="ticket-reporter"></dd>
      <dt>Przypisany agent</dt>
      <dd id="ticket-agent"></dd>
      <dt>Kontakt demonstracyjny</dt>
      <dd id="ticket-email"></dd>
      <dt>Data utworzenia</dt>
      <dd id="ticket-date"></dd>
    </dl>
  </section>
</div>
